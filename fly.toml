app = "scrible"
# Latency is felt directly here — strokes and voice both cross this hop.
# bom = Mumbai, sin = Singapore, fra = Frankfurt, iad = Virginia, lhr = London.
primary_region = "bom"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true

  # Room state lives in process memory. Do NOT raise max_machines_running or
  # enable auto_stop — a second machine would serve a different set of rooms,
  # and a stopped machine loses every live game. Swap RoomStore for a Redis
  # implementation before scaling out.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
